apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  labels:
    app: myapp

spec:
  replicas: 1

  selector:
    matchLabels:
      app: myapp

  template:
    metadata:
      labels:
        app: myapp

    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          # env:
          #   - name: APP_MESSAGE
          #     value: "hello from app yaml"
          #   - name: DB_PASSWORD
          #     value: "mysecret"
          env:
            - name: APP_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_MESSAGE
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: web-service

spec:
  type: NodePort
  selector:
    app: myapp

  ports:
    - port: 80
      targetPort: 80