apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-app
  labels:
    app: hello-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: hello-app

  template:
    metadata:
      labels:
        app: hello-app

    spec:
      containers:
        - name: hello-node
          image: embarkx/hello-node:latest
          # env:
          #   - name: ENV_VALUE
          #     value: "hello from app yaml"
          #   - name: DB_PASSWORD
          #     value: "mysecret"
          env:
            - name: ENV_VALUE
              valueFrom:
                configMapKeyRef:
                  name: hello-app-config
                  key: HELLO_APP_MESSAGE
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hello-db-secret
                  key: HELLO_DB_PASSWORD
          ports:
            - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: hello-app

spec:
  type: NodePort
  selector:
    app: hello-app

  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30001