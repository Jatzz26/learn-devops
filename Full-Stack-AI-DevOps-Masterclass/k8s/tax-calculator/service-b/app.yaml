apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
  labels:
    app: service-b

spec:
  replicas: 1

  selector:
    matchLabels:
      app: service-b

  template:
    metadata:
      labels:
        app: service-b

    spec:
      containers:
        - name: service-b
          image: embarkx/tax-service-b:latest
          # env:
          #   - name: ENV_VALUE
          #     value: "hello from app yaml"
          #   - name: DB_PASSWORD
          #     value: "mysecret"
          # env:
          #   - name: ENV_VALUE
          #     valueFrom:
          #       configMapKeyRef:
          #         name: hello-app-config
          #         key: HELLO_APP_MESSAGE
          #   - name: DB_PASSWORD
          #     valueFrom:
          #       secretKeyRef:
          #         name: hello-db-secret
          #         key: HELLO_DB_PASSWORD
          ports:
            - containerPort: 4000

---
apiVersion: v1
kind: Service
metadata:
  name: service-b

spec:
  type: ClusterIP
  selector:
    app: service-b

  ports:
    - port: 4000
      targetPort: 4000
